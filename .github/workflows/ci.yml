name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Build and verify vendored engine
        run: node scripts/build.mjs
      - name: Check syntax and packaged HTML
        run: node scripts/check.mjs
      - name: Verify audio and embedded worker
        run: node --test tests/audio.test.mjs tests/worker.test.mjs
      - name: Verify local launcher and portable package
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Verify committed HTML matches its source
        run: git diff --exit-code -- dist/index.html
      - name: Package portable app
        if: runner.os == 'Linux'
        run: python scripts/package.py
      - name: Upload portable app and checksum
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: music-gay-portable
          path: release/
          if-no-files-found: error
          retention-days: 30
